<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Firebase App (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<!-- Firebase Firestore (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<title>ลอยกระทงออนไลน์</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#12151e;color:#f1f5f9;min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:100%;max-width:100%;height:340px;background:linear-gradient(180deg,#0a1931 0%,#183153 65%,#0d233a 100%);overflow:hidden;transition:all .8s ease}
.stage.full{height:calc(100vh - 62px);max-width:100%}
.stage.fw{background:linear-gradient(180deg,#160826 0%,#341252 65%,#18092b 100%)}
.stage.fr{background:linear-gradient(180deg,#041a17 0%,#0b362f 65%,#051f1b 100%)}
.moon{position:absolute;top:24px;right:28px;width:44px;height:44px;background:#fef08a;border-radius:50%;box-shadow:0 0 25px #fde047}
.stage.fr .moon{background:#bbf7d0;box-shadow:0 0 25px #4ade80}
.hill{position:absolute;bottom:95px;left:-10%;width:70%;height:35px;background:#060a17;border-radius:50% 50% 0 0;opacity:.6;transition:bottom .8s}
.stage.full .hill{bottom:42vh}

/* แม่น้ำสีฟ้าสดใสมีคลื่นนุ่มนวล */
.river{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:130px;
    background: linear-gradient(180deg, #1e90ff 0%, #0066cc 60%, #004080 100%);
    border-top: 3px solid rgba(255, 255, 255, 0.4);
    transition: height .8s;
    box-shadow: inset 0 15px 25px rgba(255, 255, 255, 0.25);
    overflow: hidden;
}

.river::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 0;
    width: 200%;
    height: 20px;
    background: radial-gradient(ellipse at center, rgba(135, 206, 250, 0.5) 0%, transparent 70%);
    background-size: 60px 20px;
    animation: waveFlow 14s linear infinite;
}

@keyframes waveFlow {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.stage.full .river{
    height:45vh;
}

.mbtn{position:absolute;top:16px;left:16px;z-index:20;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.b-bar{position:fixed;bottom:20px;left:0;width:100%;padding:0 16px;z-index:40;display:none;justify-content:center;gap:10px}
.shr-btn{background:rgba(15,23,42,.9);border:1px solid #38bdf8;color:#38bdf8;padding:11px 16px;border-radius:25px;font-size:13px;font-weight:600;cursor:pointer}
.reopen{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;padding:11px 18px;border-radius:25px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.fwk{position:absolute;width:5px;height:5px;border-radius:50%;animation:bm 1.5s ease-out infinite}
@keyframes bm{0%{transform:scale(.1);opacity:1}100%{transform:scale(1);opacity:0;box-shadow:0 -28px 0 #f43f5e,24px -14px 0 #facc15,24px 14px 0 #38bdf8,0 28px 0 #4ade80,-24px 14px 0 #c084fc,-24px -14px 0 #fb923c}}
.fly{position:absolute;width:5px;height:5px;background:#bef264;border-radius:50%;box-shadow:0 0 8px #bef264;animation:bk 2.2s ease-in-out infinite alternate}
@keyframes bk{0%{opacity:.15}100%{opacity:1;transform:translate(10px,-10px)}}
.stats{width:100%;max-width:100%;background:#181c26;display:grid;grid-template-columns:repeat(3,1fr);padding:12px 8px;text-align:center;border-bottom:1px solid #262b38;transition:max-width .8s}
.stats.full{max-width:100%}
.st-lbl{font-size:11px;color:#94a3b8;margin-bottom:3px}
.st-val{font-size:14px;font-weight:700;color:#fbbf24}
.form{width:100%;max-width:600px;padding:24px 20px 40px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;color:#cbd5e1;margin-bottom:6px;display:block}
select,input{width:100%;background:#1e2330;border:1px solid #333b4d;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;outline:none}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pill{background:#1e2330;border:1px solid #333b4d;color:#e2e8f0;padding:9px 4px;border-radius:20px;font-size:12px;cursor:pointer;text-align:center}
.pill.on{background:#2563eb;border-color:#3b82f6;color:#fff;font-weight:600}
.dots{display:flex;gap:12px;align-items:center}
.dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.dot.on{border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 2px #2563eb}
.prev-row{display:flex;align-items:center;justify-content:space-between;background:#181c26;border:1px solid #262b38;padding:10px 16px;border-radius:12px}
.go{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}

/* กำหนดการจัดวางของตัวกระทงอย่างถูกต้อง ไม่ตั้ง CSS animation ตายตัวที่นี่ */
.kt{
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
}

.tg{background:rgba(255,255,255,0.95);border:1px solid #fcd34d;padding:4px 10px;border-radius:14px;font-size:11px;color:#1e293b;margin-bottom:2px;white-space:nowrap;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.25)}
.tg b{color:#d97706;display:block;font-size:11px;font-weight:700}

/* อนิเมชันเคลื่อนที่อิสระจากซ้ายไปขวาพร้อมโคลงเคลงเบาๆ */
@keyframes floatFlow {
    0% { left: -100px; transform: translateY(0px); }
    25% { transform: translateY(-4px); }
    50% { transform: translateY(3px); }
    75% { transform: translateY(-3px); }
    100% { left: 105%; transform: translateY(0px); }
}
</style>
</head>
<body>
<audio id="au" src="song.mp3" loop></audio>
<div class="stage" id="stg">
<button class="mbtn" id="mb" onclick="togM()">🔇 เปิดเพลงวันเพ็ญ</button>
<div class="moon"></div>
<div class="hill"></div>
<div id="fx"></div>
<div class="river" id="rv"></div>
</div>
<div class="stats" id="stBar">
<div><div class="st-lbl">กระทงในแม่น้ำ</div><div class="st-val" id="cnt">0 ใบ</div></div>
<div><div class="st-lbl">บรรยากาศงาน</div><div class="st-val" id="bgTxt">คืนเดือนเพ็ญ</div></div>
<div><div class="st-lbl">สถานะดนตรี</div><div class="st-val" id="mTxt">ปิดเสียง</div></div>
</div>

<div class="form" id="formBox">
<div>
<span class="lbl">เลือกบรรยากาศฉากหลัง</span>
<select id="bgSel" onchange="sBg(this.value)">
<option value="">คืนเดือนเพ็ญ & โคมลอย</option>
<option value="fw">พลุเฉลิมฉลองงานวัด</option>
<option value="fr">หิ่งห้อยเรืองแสงริมตลิ่ง</option>
</select>
</div>

<div>
<span class="lbl">1. รูปแบบวัสดุกระทง</span>
<div class="pills">
<button type="button" class="pill on" onclick="sT('banana',this)">ใบตอง</button>
<button type="button" class="pill" onclick="sT('lotus',this)">กลีบบัว</button>
<button type="button" class="pill" onclick="sT('coconut',this)">กะลา</button>
<button type="button" class="pill" onclick="sT('bread',this)">ขนมปังเต่า</button>
</select>
</div>

<div>
<span class="lbl">2. โทนสีกระทง / กลีบวัสดุ (8 สี)</span>
<div class="dots" style="flex-wrap:wrap">
<div class="dot on" style="background:#4ade80" onclick="sC('p','#4ade80',this)"></div>
<div class="dot" style="background:#f43f5e" onclick="sC('p','#f43f5e',this)"></div>
<div class="dot" style="background:#f9a8d4" onclick="sC('p','#f9a8d4',this)"></div>
<div class="dot" style="background:#a855f7" onclick="sC('p','#a855f7',this)"></div>
<div class="dot" style="background:#38bdf8" onclick="sC('p','#38bdf8',this)"></div>
<div class="dot" style="background:#fb923c" onclick="sC('p','#fb923c',this)"></div>
<div class="dot" style="background:#fef08a" onclick="sC('p','#fef08a',this)"></div>
<div class="dot" style="background:#ffffff" onclick="sC('p','#ffffff',this)"></div>
</select>
</div>

<div>
<span class="lbl">3. สีดอกไม้ตกแต่ง (8 สี)</span>
<div class="dots" style="flex-wrap:wrap">
<div class="dot on" style="background:#facc15" onclick="sC('f','#facc15',this)"></div>
<div class="dot" style="background:#ef4444" onclick="sC('f','#ef4444',this)"></div>
<div class="dot" style="background:#f97316" onclick="sC('f','#f97316',this)"></div>
<div class="dot" style="background:#ec4899" onclick="sC('f','#ec4899',this)"></div>
<div class="dot" style="background:#c084fc" onclick="sC('f','#c084fc',this)"></div>
<div class="dot" style="background:#06b6d4" onclick="sC('f','#06b6d4',this)"></div>
<div class="dot" style="background:#4ade80" onclick="sC('f','#4ade80',this)"></div>
<div class="dot" style="background:#ffffff" onclick="sC('f','#ffffff',this)"></div>
</select>
</div>

<div class="prev-row">
<span style="font-size:13px;color:#cbd5e1">ตัวอย่างกระทงของคุณ:</span>
<div id="pv"></div>
</div>

<div>
<span class="lbl">ชื่อของคุณ</span>
<input id="un" placeholder="เช่น สมชาย">
</div>

<div>
<span class="lbl">คำอธิษฐาน</span>
<input id="uw" placeholder="เช่น ขอให้มีความสุข สุขภาพแข็งแรง">
</div>

<button type="button" class="go" onclick="goK()">✨ ปล่อยกระทงลงสู่สายน้ำ ✨</button>
</div>

<div class="b-bar" id="bBar">
<button type="button" class="shr-btn" onclick="shareWeb()">🔗 แชร์ชวนเพื่อน</button>
<button type="button" class="reopen" onclick="showForm()">➕ สร้างกระทงเพิ่ม</button>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDFoU2C8JT9Sap_fysr7eixDclufc-U1UU",
  authDomain: "eateryicsloykrathong.firebaseapp.com",
  projectId: "eateryicsloykrathong",
  storageBucket: "eateryicsloykrathong.firebasestorage.app",
  messagingSenderId: "960239018233",
  appId: "1:960239018233:web:f6a9b451ddd89dbaaec228"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var d={t:'banana',p:'#4ade80',f:'#facc15'},pl=0,ac=null,tm=null,st=0,total=0;
var nt="262,330,392,440,392,0,330,392,440,523,440,392,0,440,523,587,659,587,0,523,440,392,330,392,440,392,330,0,392,440,523,440,0,392,330,392,330,0,294,330,392,330,294,0,262,294,330,392,330,294,262,294,0,330,392,440,392,330,294,0,330,392,440,392,330,262,0".split(",");
function svg(c,w){
var t=c.t,p=c.p,f=c.f,top='<ellipse cx="50" cy="10" rx="4" ry="7" fill="#ff9800"/><rect x="48" y="16" width="4" height="22" fill="'+f+'"/><line x1="43" y1="14" x2="46" y2="38" stroke="#a1887f" stroke-width="1.5"/><line x1="57" y1="14" x2="54" y2="38" stroke="#a1887f" stroke-width="1.5"/>',b='';
if(t=='lotus')b='<path d="M12,48 Q15,28 32,36 Q25,52 12,48Z" fill="'+p+'" stroke="#880e4f"/><path d="M88,48 Q85,28 68,36 Q75,52 88,48Z" fill="'+p+'" stroke="#880e4f"/><path d="M22,52 Q28,22 44,34 Q38,54 22,52Z" fill="'+p+'" stroke="#880e4f"/><path d="M78,52 Q72,22 56,34 Q62,54 78,52Z" fill="'+p+'" stroke="#880e4f"/><path d="M36,54 Q50,18 64,54 Q50,62 36,54Z" fill="'+p+'" stroke="#880e4f"/><path d="M16,50 Q50,76 84,50 Q50,62 16,50Z" fill="#15803d"/><circle cx="50" cy="40" r="5" fill="'+f+'"/>';
else if(t=='coconut')b='<polygon points="22,42 36,24 50,42" fill="'+p+'"/><polygon points="50,42 64,24 78,42" fill="'+p+'"/><circle cx="36" cy="39" r="4.5" fill="'+f+'"/><circle cx="50" cy="38" r="5" fill="'+f+'"/><circle cx="64" cy="39" r="4.5" fill="'+f+'"/><path d="M14,42 A36,30 0 0,0 86,42Z" fill="#4e342e"/><circle cx="44" cy="54" r="2.2" fill="#261612"/><circle cx="56" cy="54" r="2.2" fill="#261612"/>';
else if(t=='bread')b='<ellipse cx="50" cy="54" rx="36" ry="16" fill="#d4a373" stroke="#8d5524" stroke-width="2"/><circle cx="14" cy="52" r="7" fill="#e6ccb2" stroke="#8d5524" stroke-width="1.5"/><circle cx="12" cy="50" r="1.5" fill="#000"/><ellipse cx="28" cy="66" rx="6" ry="4" fill="#b08968"/><ellipse cx="72" cy="66" rx="6" ry="4" fill="#b08968"/><circle cx="36" cy="44" r="4.5" fill="'+p+'"/><circle cx="50" cy="42" r="5" fill="'+f+'"/><circle cx="64" cy="44" r="4.5" fill="'+p+'"/>';
else b='<polygon points="15,44 28,24 41,44" fill="'+p+'"/><polygon points="37,44 50,21 63,44" fill="'+p+'"/><polygon points="59,44 72,24 85,44" fill="'+p+'"/><circle cx="28" cy="40" r="4" fill="'+f+'"/><circle cx="50" cy="39" r="5" fill="'+f+'"/><circle cx="72" cy="40" r="4" fill="'+f+'"/><path d="M12,44 L88,44 L76,70 Q50,76 24,70Z" fill="#15803d"/>';
return '<svg width="'+w+'" height="'+(w*.85)+'" viewBox="0 0 100 85">'+top+b+'</svg>';
}
function up(){document.getElementById('pv').innerHTML=svg(d,64)}
function togM(f){
var a=document.getElementById('au'),b=document.getElementById('mb'),mt=document.getElementById('mTxt');
if(pl&&!f){a.pause();clearInterval(tm);pl=0;b.innerHTML='🔇 เปิดเพลงวันเพ็ญ';mt.innerHTML='ปิดเสียง';}
else if(!pl){pl=1;b.innerHTML='🔊 ปิดเพลงวันเพ็ญ';mt.innerHTML='กำลังเล่น';a.play().catch(function(){
if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
if(ac.state=='suspended')ac.resume();
tm=setInterval(function(){var q=Number(nt[st%nt.length]);if(q>0){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=q;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.32);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.32)}st++},340);
})}
}
function sBg(v){
var s=document.getElementById('stg');
var isFull=s.classList.contains('full');
s.className='stage'+(isFull?' full':'')+(v?' '+v:'');
document.getElementById('bgTxt').innerHTML=v=='fw'?'พลุงานวัด':(v=='fr'?'หิ่งห้อยประกาย':'คืนเดือนเพ็ญ');
var fx=document.getElementById('fx');fx.innerHTML='';
for(var i=0;i<(v=='fr'?20:8);i++){var e=document.createElement('div');e.className=v=='fw'?'fwk':(v=='fr'?'fly':'lnt');e.style.left=(Math.random()*88+5)+'%';e.style.top=v==''?'auto':(Math.random()*45+10)+'%';if(v=='')e.style.bottom='105px';e.style.animationDelay=(Math.random()*3)+'s';fx.appendChild(e)}
}
function sT(v,el){d.t=v;el.parentElement.querySelectorAll('.pill').forEach(function(x){x.classList.remove('on')});el.classList.add('on');if(v=='lotus')d.p='#f43f5e';else if(v=='banana')d.p='#4ade80';up()}
function sC(k,v,el){if(k=='p')d.p=v;else d.f=v;el.parentElement.querySelectorAll('.dot').forEach(function(x){x.classList.remove('on')});el.classList.add('on');up()}

function sp(n,w,c){
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
total++;document.getElementById('cnt').innerHTML=total+' ใบ';
var e=document.createElement('div');
e.className='kt';

// สุ่มความสูง (top) 5px - 60px ภายในแม่น้ำ
var rTop = Math.floor(Math.random() * 55) + 5; 
// สุ่มความเร็วลอย (22 ถึง 36 วินาที)
var rDur = (Math.random() * 14 + 22).toFixed(1);
// สุ่มจังหวะเริ่มต้น (delay) ไม่ให้เกิดพร้อมกัน
var rDel = (Math.random() * -30).toFixed(1);

e.style.top = rTop + 'px';
e.style.zIndex = rTop;
e.style.animation = 'floatFlow ' + rDur + 's linear infinite';
e.style.animationDelay = rDel + 's';

e.innerHTML='<div class="tg"><b>'+esc(n)+'</b>'+esc(w||'')+'</div>'+svg(c,52);
document.getElementById('rv').appendChild(e);
}

var isFirst=true;
db.collection("krathongs").orderBy("time","desc").limit(15).onSnapshot(function(snap){
if(isFirst){
var arr=[];snap.forEach(function(doc){arr.push(doc.data())});
arr.reverse().forEach(function(item,idx){setTimeout(function(){sp(item.n,item.w,item.c)},idx*600)});
isFirst=false;
}else{
snap.docChanges().forEach(function(chg){if(chg.type==="added"){var item=chg.doc.data();sp(item.n,item.w,item.c);}});
}
});

function goK(){
if(!pl)togM(1);
var n=document.getElementById('un').value.trim()||'ผู้ไม่ประสงค์ออกนาม',w=document.getElementById('uw').value.trim()||'ขอให้มีความสุข';
var cfg={t:d.t,p:d.p,f:d.f};
document.getElementById('uw').value='';
document.getElementById('formBox').style.display='none';
document.getElementById('stg').classList.add('full');
document.getElementById('stBar').classList.add('full');
document.getElementById('bBar').style.display='flex';
db.collection("krathongs").add({n:n,w:w,c:cfg,time:firebase.firestore.FieldValue.serverTimestamp()});
}
function showForm(){
document.getElementById('formBox').style.display='flex';
document.getElementById('stg').classList.remove('full');
document.getElementById('stBar').classList.remove('full');
document.getElementById('bBar').style.display='none';
}
function shareWeb(){
if(navigator.share){navigator.share({title:'ลอยกระทงออนไลน์',text:'มาร่วมออกแบบกระทงและลอยกระทงออนไลน์ด้วยกันนะ!',url:window.location.href})}
else{navigator.clipboard.writeText(window.location.href);alert('คัดลอกลิงก์เว็บไซต์เรียบร้อยแล้ว ส่งให้เพื่อนได้เลยค่ะ!')}
}
up();sBg('');
</script>
</body>
</html>
